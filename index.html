<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offa Connect by Leo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --navy:#071A2B;
  --blue:#0B5C8E;
  --teal:#0B8F87;
  --green:#18A06A;
  --gold:#D9A441;
  --cream:#F7F4EE;
  --ink:#132235;
  --muted:#6E7D8C;
  --line:#E4EAF0
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(145deg,#071A2B,#0B5C8E,#0B8F87);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  min-height:100vh
}

button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}

.app{
  max-width:980px;
  margin:auto;
  min-height:100vh;
  padding-bottom:88px
}

.top{
  color:#fff;
  padding:25px 20px
}

.brand{
  font-size:32px;
  font-weight:900
}

.brand b{color:var(--gold)}

.tag{
  font-weight:700;
  color:#d9e6ed;
  margin-top:4px
}

.shell{
  background:var(--cream);
  margin:0 12px;
  border-radius:30px;
  min-height:calc(100vh - 145px);
  overflow:hidden
}

.content{padding:20px}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 12px 35px #071a2b12
}

h1{
  margin:0 0 17px;
  font-size:31px
}

h2{
  margin:0 0 14px
}

.input,
.select,
.textarea,
.search{
  width:100%;
  padding:14px;
  border:2px solid var(--line);
  border-radius:16px;
  background:#fff;
  outline:none
}

.textarea{min-height:100px}

.search:focus,
.input:focus,
.select:focus,
.textarea:focus{
  border-color:var(--teal)
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px
}

.person{
  display:flex;
  align-items:center;
  gap:15px
}

.avatar{
  width:86px;
  height:86px;
  border-radius:50%;
  object-fit:cover;
  background:#eaf0f3
}

.avatar.big{
  width:120px;
  height:120px
}

.name{
  font-size:21px;
  font-weight:900
}

.meta{
  color:var(--muted);
  font-weight:700
}

.bio{
  margin-top:12px;
  line-height:1.5
}

.goal{
  display:inline-block;
  background:#e6f5f1;
  color:#08766f;
  border-radius:99px;
  padding:6px 10px;
  margin-top:8px;
  font-size:13px;
  font-weight:900
}

.actions{
  display:flex;
  gap:9px;
  justify-content:flex-end;
  margin-top:15px
}

.btn{
  padding:13px 17px;
  border-radius:15px;
  font-weight:900
}

.green{
  background:var(--green);
  color:#fff
}

.blue{
  background:var(--blue);
  color:#fff
}

.ghost{
  background:#edf2f5;
  color:var(--ink)
}

.gold{
  background:var(--gold);
  color:#fff
}

.empty{
  text-align:center;
  padding:35px;
  color:var(--muted);
  font-weight:800
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(980px,100%);
  background:#fffffff5;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:9px 8px calc(9px + env(safe-area-inset-bottom));
  z-index:20
}

.nav{
  background:none;
  color:var(--muted);
  font-weight:900;
  padding:5px
}

.nav.active{color:var(--blue)}

.ni{
  font-size:21px;
  display:block
}

.nl{font-size:12px}

.badge{
  background:var(--gold);
  color:white;
  border-radius:20px;
  padding:2px 6px;
  font-size:10px
}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px
}

.authbox{
  width:min(520px,100%);
  background:#fff;
  border-radius:30px;
  padding:30px;
  box-shadow:0 25px 70px #0005
}

.authlogo{
  font-size:44px;
  font-weight:950
}

.authlogo b{color:var(--gold)}

.sub{
  color:var(--muted);
  font-size:18px;
  margin:7px 0 23px
}

.stack{
  display:grid;
  gap:11px
}

.error{
  color:#c43d4b;
  font-weight:800;
  min-height:25px
}

.link{
  background:none;
  color:var(--blue);
  font-weight:900
}

.chatrow{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:18px;
  margin-bottom:9px
}

.chatrow .avatar{
  width:56px;
  height:56px
}

.messages{
  height:53vh;
  min-height:350px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:15px 2px
}

.bubble{
  max-width:78%;
  padding:11px 13px;
  border-radius:18px;
  word-break:break-word
}

.mine{
  align-self:flex-end;
  background:var(--blue);
  color:#fff;
  border-bottom-right-radius:5px
}

.theirs{
  align-self:flex-start;
  background:#edf2f5;
  border-bottom-left-radius:5px
}

.small{
  font-size:10px;
  opacity:.65;
  margin-top:4px
}

.photo{
  max-width:230px;
  border-radius:12px
}

.composer{
  display:flex;
  gap:7px;
  align-items:center;
  border-top:1px solid var(--line);
  padding-top:11px
}

.composer .input{flex:1}

.attach,
.send{
  height:46px;
  border-radius:14px
}

.attach{
  width:46px;
  background:#edf2f5;
  font-size:20px
}

.send{
  width:50px;
  background:var(--green);
  color:#fff
}

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:40
}

.modal.show{display:flex}

.modalbox{
  background:#fff;
  border-radius:25px;
  padding:22px;
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto
}

.modalhead{
  display:flex;
  justify-content:space-between
}

.close{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#edf2f5
}

@media(max-width:600px){
  .filters{grid-template-columns:1fr}
  .content{padding:15px}
  .shell{
    margin:0;
    border-radius:28px 28px 0 0
  }
  .authbox{padding:24px}
}
</style>
</head>

<body>

<div id="root"></div>

<script>

const URL="https://irjahjpdjuvlmlcgtusr.supabase.co";

const KEY="sb_publishable_HoMz0Vb4krVkz1p4Dm5_dg_hFuaxwxl";

const supabase=window.supabase.createClient(URL,KEY);

let session=null;
let me=null;
let people=[];
let matches=[];
let selected=null;
let msgs=[];
let tab="discover";
let query="";
let channel=null;
let file=null;

const $=x=>document.getElementById(x);

const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
}[c]));

const img=p=>p?.avatar_url||
"data:image/svg+xml;charset=utf-8,"+
encodeURIComponent(
'<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">'+
'<rect width="100%" height="100%" fill="#e9eff3"/>'+
'<text x="50%" y="60%" text-anchor="middle" font-size="45" fill="#0B5C8E">♥</text>'+
'</svg>'
);

function auth(sign=false,e=""){

  root.innerHTML=`
  <div class=auth>
    <div class=authbox>

      <div class=authlogo>
        Offa <b>Connect</b>
      </div>

      <div class=sub>
        <b>by Leo</b> · Meet. Connect. Belong.
      </div>

      <div class=error>${esc(e)}</div>

      <div class=stack>

        ${sign?
        '<input id=name class=input placeholder="Your name">'+
        '<input id=age class=input type=number min=18 placeholder="Age">'
        :''}

        <input
          id=email
          class=input
          type=email
          placeholder="Email"
        >

        <input
          id=pass
          class=input
          type=password
          placeholder="Password"
        >

        ${sign?
        '<select id=sex class=select>'+
        '<option value="">Sex (optional)</option>'+
        '<option>Male</option>'+
        '<option>Female</option>'+
        '</select>'
        :''}

        <button
          class="btn blue"
          onclick="${sign?'signup()':'login()'}"
        >
          ${sign?'Create account':'Log in'}
        </button>

      </div>

      <p style="text-align:center;color:var(--muted)">
        ${sign?'Already have an account?':'New to Offa Connect?'}

        <button
          class=link
          onclick="auth(${!sign})"
        >
          ${sign?'Back to login':'Create account'}
        </button>
      </p>

    </div>
  </div>`;
}

async function login(){

  let email=$("email").value.trim();
  let password=$("pass").value;

  if(!email||!password)
    return auth(false,"Enter your email and password.");

  let r=await supabase.auth.signInWithPassword({
    email,
    password
  });

  if(r.error)
    return auth(false,r.error.message);

  session=r.data.session;

  await boot();
}

async function signup(){

  let name=$("name").value.trim();
  let age=+$("age").value;
  let email=$("email").value.trim();
  let password=$("pass").value;
  let sex=$("sex").value;

  if(
    !name||
    age<18||
    !email||
    password.length<6
  )
    return auth(
      true,
      "Enter a name, age 18+, valid email and 6+ character password."
    );

  let r=await supabase.auth.signUp({
    email,
    password
  });

  if(r.error)
    return auth(true,r.error.message);

  if(r.data.session){

    session=r.data.session;

    let p=await supabase
      .from("profiles")
      .upsert({
        id:r.data.user.id,
        name,
        age,
        city:"Offa",
        bio:"",
        sex:sex||null
      });

    if(p.error)
      return auth(true,p.error.message);

    await boot();

  }else{

    auth(
      false,
      "Account created. Check your email, then log in."
    );

  }
}

async function boot(){

  await loadMe();
  await loadPeople();
  await loadMatches();

  render();

  if(channel)
    supabase.removeChannel(channel);

  channel=supabase
    .channel("offa-live")
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      p=>{

        if(
          selected &&
          p.new.match_id===selected.id &&
          !msgs.some(x=>x.id===p.new.id)
        ){

          msgs.push(p.new);
          render();

        }

      }
    )
    .subscribe();
}

async function loadMe(){

  let r=await supabase
    .from("profiles")
    .select("*")
    .eq("id",session.user.id)
    .single();

  if(r.error)
    throw r.error;

  me=r.data;
}

async function loadPeople(){

  let r=await supabase
    .from("profiles")
    .select("*")
    .neq("id",session.user.id)
    .order("created_at",{ascending:false});

  people=r.data||[];
}

async function loadMatches(){

  let r=await supabase
    .from("matches")
    .select(
      "id,user_one,user_two,"+
      "user_one_profile:profiles!matches_user_one_fkey(*),"+
      "user_two_profile:profiles!matches_user_two_fkey(*)"
    )
    .or(
      `user_one.eq.${session.user.id},user_two.eq.${session.user.id}`
    )
    .order("created_at",{ascending:false});

  matches=(r.data||[]).map(m=>({

    ...m,

    person:
      m.user_one===session.user.id
      ?m.user_two_profile
      :m.user_one_profile

  }));
}

function render(){

  if(!session)
    return auth();

  root.innerHTML=`

  <div class=app>

    <header class=top>

      <div class=brand>
        Offa <b>Connect</b>
      </div>

      <div class=tag>
        <b>by Leo</b> · Meet. Connect. Belong.
      </div>

    </header>

    <main class=shell>

      <section class=content>

        ${
          tab==="discover"
          ?discover()
          :tab==="matches"
          ?matchView()
          :tab==="chat"
          ?chatView()
          :profileView()
        }

      </section>

    </main>

    <nav class=bottom>

      <button
        class="nav ${tab==="discover"?"active":""}"
        onclick="go('discover')"
      >
        <span class=ni>♥</span>
        <span class=nl>Discover</span>
      </button>

      <button
        class="nav ${tab==="matches"?"active":""}"
        onclick="go('matches')"
      >
        <span class=ni>
          ♡
          ${
            matches.length
            ?`<span class=badge>${matches.length}</span>`
            :""
          }
        </span>

        <span class=nl>Matches</span>
      </button>

      <button
        class="nav ${tab==="chat"?"active":""}"
        onclick="go('chat')"
      >
        <span class=ni>▣</span>
        <span class=nl>Chat</span>
      </button>

      <button
        class="nav ${tab==="profile"?"active":""}"
        onclick="go('profile')"
      >
        <span class=ni>●</span>
        <span class=nl>Profile</span>
      </button>

    </nav>

  </div>`;
}

function discover(){

  let list=people.filter(p=>
    !query||
    [
      p.name,
      p.city,
      p.bio,
      p.relationship_goal,
      p.sex
    ]
    .join(" ")
    .toLowerCase()
    .includes(query.toLowerCase())
  );

  return `

  <div class=card>

    <h1>Discover</h1>

    <input
      class=search
      placeholder="Search by name, city or bio"
      value="${esc(query)}"
      oninput="query=this.value;render()"
    >

  </div>

  ${
    list.map(p=>`

      <div class=card>

        <div class=person>

          <img
            class=avatar
            src="${img(p)}"
          >

          <div>

            <div class=name>
              ${esc(p.name)}, ${esc(p.age)}
            </div>

            <div class=meta>
              📍 ${esc(p.city||"Offa")}
            </div>

            ${
              p.relationship_goal
              ?`<span class=goal>
                  ${esc(p.relationship_goal)}
                </span>`
              :""
            }

          </div>

        </div>

        ${
          p.bio
          ?`<div class=bio>${esc(p.bio)}</div>`
          :""
        }

        <div class=actions>

          <button
            class="btn ghost"
            onclick="pass('${p.id}')"
          >
            ✕ Pass
          </button>

          <button
            class="btn green"
            onclick="like('${p.id}')"
          >
            ♥ Like
          </button>

        </div>

      </div>

    `).join("")
    ||
    '<div class="card empty">No profiles found yet.</div>'
  }`;
}

async function like(id){

  let r=await supabase
    .from("likes")
    .insert({
      from_user:session.user.id,
      to_user:id
    });

  if(
    r.error &&
    !r.error.message.toLowerCase().includes("duplicate")
  )
    return alert(r.error.message);

  people=people.filter(p=>p.id!==id);

  await loadMatches();

  render();
}

function pass(id){

  people=people.filter(p=>p.id!==id);

  render();
}

function matchView(){

  return `

  <div class=card>

    <h1>Your Matches</h1>

    <div class=meta>
      People who matched with you.
    </div>

  </div>

  ${
    matches.map(m=>`

      <div
        class=chatrow
        onclick="openChat(${m.id})"
      >

        <img
          class=avatar
          src="${img(m.person)}"
        >

        <div style="flex:1">

          <div class=name>
            ${esc(m.person?.name)}
          </div>

          <div class=meta>
            ${esc(m.person?.city||"Offa")}
          </div>

        </div>

        <b style="color:var(--blue)">
          Chat ›
        </b>

      </div>

    `).join("")
    ||
    '<div class="card empty">No matches yet.</div>'
  }`;
}

function chatView(){

  if(!selected)

    return `

    <div class=card>

      <h1>Chat</h1>

      <div class=meta>
        Choose a match to start chatting.
      </div>

    </div>

    ${
      matches.map(m=>`

        <div
          class=chatrow
          onclick="openChat(${m.id})"
        >

          <img
            class=avatar
            src="${img(m.person)}"
          >

          <div>

            <div class=name>
              ${esc(m.person?.name)}
            </div>

            <div class=meta>
              Open conversation ›
            </div>

          </div>

        </div>

      `).join("")
      ||
      '<div class="card empty">No matches yet.</div>'
    }`;

  return `

  <div class=card>

    <div class=person>

      <button
        class=close
        onclick="selected=null;render()"
      >
        ‹
      </button>

      <img
        class=avatar
        src="${img(selected.person)}"
      >

      <div>

        <div class=name>
          ${esc(selected.person?.name)}
        </div>

        <div class=meta>
          Offa
        </div>

      </div>

    </div>

    <div
      id=messages
      class=messages
    >

      ${
        msgs.map(m=>`

          <div
            class="bubble ${
              m.sender_id===session.user.id
              ?"mine"
              :"theirs"
            }"
          >

            ${
              m.attachment_url
              ?
                (
                  (m.attachment_type||"").startsWith("image/")
                  ?
                  `<img
                    class=photo
                    src="${esc(m.attachment_url)}"
                  >`
                  :
                  `<a
                    href="${esc(m.attachment_url)}"
                    target=_blank
                    rel=noopener
                    style="color:inherit;font-weight:900"
                  >
                    📎 ${esc(m.attachment_name||"Attachment")}
                  </a>`
                )
              :""
            }

            ${esc(m.message||"")}

            <div class=small>
              ${
                new Date(m.created_at)
                .toLocaleTimeString(
                  [],
                  {
                    hour:"numeric",
                    minute:"2-digit"
                  }
                )
              }
            </div>

          </div>

        `).join("")
        ||
        '<div class=empty>Say hello 👋</div>'
      }

    </div>

    <div class=composer>

      <button
        class=attach
        onclick="file.click()"
      >
        ＋
      </button>

      <input
        id=chatInput
        class=input
        placeholder="Write a message..."
        onkeydown="if(event.key==='Enter')send()"
      >

      <input
        id=file
        type=file
        style="display:none"
        onchange="picked(this)"
      >

      <button
        class=send
        onclick=send()
      >
        ➤
      </button>

    </div>

    ${
      file
      ?`<div class=meta>
          Selected: ${esc(file.name)}
        </div>`
      :""
    }

  </div>`;
}

async function openChat(id){

  selected=matches.find(m=>m.id===id);

  msgs=[];

  tab="chat";

  render();

  let r=await supabase
    .from("messages")
    .select("*")
    .eq("match_id",id)
    .order("created_at",{ascending:true});

  msgs=r.data||[];

  render();

  setTimeout(()=>{

    let x=$("messages");

    if(x)
      x.scrollTop=x.scrollHeight;

  },50);
}

function picked(x){

  file=x.files?.[0]||null;

  render();
}

async function send(){

  if(!selected)
    return;

  let text=($("chatInput")?.value||"").trim();

  if(!text&&!file)
    return;

  let a={};

  try{

    if(file){

      if(file.size>15*1024*1024)
        throw Error("File must be 15 MB or smaller.");

      let safe=file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );

      let path=
        `${session.user.id}/${selected.id}/${Date.now()}-${safe}`;

      let u=await supabase
        .storage
        .from("chat-attachments")
        .upload(
          path,
          file,
          {
            contentType:
              file.type||
              "application/octet-stream"
          }
        );

      if(u.error)
        throw u.error;

      let pub=supabase
        .storage
        .from("chat-attachments")
        .getPublicUrl(path);

      a={
        attachment_url:pub.data.publicUrl,
        attachment_name:safe,
        attachment_type:
          file.type||
          "application/octet-stream"
      };
    }

    let r=await supabase
      .from("messages")
      .insert({
        match_id:selected.id,
        sender_id:session.user.id,
        message:text,
        ...a
      })
      .select()
      .single();

    if(r.error)
      throw r.error;

    if(!msgs.some(m=>m.id===r.data.id))
      msgs.push(r.data);

    file=null;

    render();

  }catch(e){

    alert(e.message);

  }
}

function profileView(){

  return `

  <div
    class=card
    style="text-align:center"
  >

    <img
      class="avatar big"
      src="${img(me)}"
    >

    <h1 style="margin:12px 0 3px">
      ${esc(me.name)}
    </h1>

    <div class=meta>
      ${esc(me.age)} · ${esc(me.city||"Offa")}
    </div>

    ${
      me.bio
      ?`<p>${esc(me.bio)}</p>`
      :""
    }

    ${
      me.relationship_goal
      ?`<span class=goal>
          ${esc(me.relationship_goal)}
        </span>`
      :""
    }

    <div
      class=actions
      style="justify-content:center"
    >

      <button
        class="btn blue"
        onclick=edit()
      >
        Edit profile
      </button>

      <button
        class="btn ghost"
        onclick=logout()
      >
        Log out
      </button>

    </div>

  </div>

  <div class=card>

    <h2>Offa Connect</h2>

    <div class=meta>
      Meet. Connect. Belong.
    </div>

    <p>
      For people from Offa and people connected to Offa.
    </p>

  </div>`;
}

function edit(){

  root.insertAdjacentHTML(
    "beforeend",

    `<div
      class="modal show"
      id=modal
    >

      <div class=modalbox>

        <div class=modalhead>

          <h2>Edit profile</h2>

          <button
            class=close
            onclick="modal.remove()"
          >
            ×
          </button>

        </div>

        <div class=stack>

          <input
            id=en
            class=input
            value="${esc(me.name)}"
          >

          <input
            id=ea
            class=input
            type=number
            min=18
            value="${me.age}"
          >

          <input
            id=ec
            class=input
            value="${esc(me.city||"Offa")}"
          >

          <select id=eg class=select>

            <option value="">
              Relationship goal
            </option>

            <option
              ${me.relationship_goal==="Single"?"selected":""}
            >
              Single
            </option>

            <option
              ${me.relationship_goal==="Dating"?"selected":""}
            >
              Dating
            </option>

            <option
              ${me.relationship_goal==="Relationship"?"selected":""}
            >
              Relationship
            </option>

            <option
              ${me.relationship_goal==="Friendship"?"selected":""}
            >
              Friendship
            </option>

          </select>

          <textarea
            id=eb
            class=textarea
          >${esc(me.bio||"")}</textarea>

          <button
            class="btn green"
            onclick=save()
          >
            Save profile
          </button>

        </div>

      </div>

    </div>`
  );
}

async function save(){

  let r=await supabase
    .from("profiles")
    .update({
      name:en.value.trim(),
      age:+ea.value,
      city:ec.value.trim()||"Offa",
      relationship_goal:eg.value||null,
      bio:eb.value.trim()
    })
    .eq("id",session.user.id)
    .select()
    .single();

  if(r.error)
    return alert(r.error.message);

  me=r.data;

  modal.remove();

  render();
}

async function go(x){

  tab=x;

  if(x!=="chat")
    selected=null;

  if(x==="matches"||x==="chat")
    await loadMatches();

  render();
}

async function logout(){

  await supabase.auth.signOut();

  session=null;
  me=null;
  people=[];
  matches=[];

  auth();
}

supabase.auth.getSession().then(async r=>{

  session=r.data.session;

  if(session){

    try{

      await boot();

    }catch(e){

      auth(false,e.message);

    }

  }else{

    auth();

  }

});

</script>

</body>
</html>
