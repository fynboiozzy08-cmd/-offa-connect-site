<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
:root{
  --navy:#071A2B;
  --blue:#0B5C8E;
  --teal:#0B8F87;
  --green:#18A06A;
  --gold:#D9A441;
  --cream:#F7F4EE;
  --white:#FFFFFF;
  --ink:#132235;
  --muted:#6E7D8C;
  --line:#E4EAF0;
  --red:#C83D4B;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:
    linear-gradient(
      145deg,
      #061827 0%,
      #0B5C8E 48%,
      #0B8F87 100%
    );
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

#root{
  min-height:100vh;
}

/* =========================
   APP
========================= */

.app{
  max-width:1000px;
  min-height:100vh;
  margin:auto;
  padding-bottom:90px;
}

.top{
  padding:25px 20px;
  color:white;
}

.brand{
  font-size:32px;
  line-height:1;
  font-weight:900;
}

.brand span{
  color:var(--gold);
}

.tag{
  margin-top:8px;
  color:#D9E6ED;
  font-weight:700;
}

.shell{
  min-height:calc(100vh - 140px);
  margin:0 12px;
  overflow:hidden;
  border-radius:30px;
  background:var(--cream);
}

.content{
  padding:20px;
}

/* =========================
   CARDS
========================= */

.card{
  margin-bottom:15px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:24px;
  background:white;
  box-shadow:0 12px 35px rgba(7,26,43,.07);
}

h1{
  margin:0 0 17px;
  font-size:31px;
}

h2{
  margin:0 0 14px;
}

.meta{
  color:var(--muted);
  font-weight:700;
}

/* =========================
   INPUTS
========================= */

.input,
.select,
.textarea,
.search{
  width:100%;
  padding:14px;
  border:2px solid var(--line);
  border-radius:16px;
  outline:none;
  background:white;
  color:var(--ink);
}

.input:focus,
.select:focus,
.textarea:focus,
.search:focus{
  border-color:var(--teal);
}

.textarea{
  min-height:110px;
  resize:vertical;
}

.stack{
  display:grid;
  gap:11px;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  padding:13px 17px;
  border-radius:15px;
  font-weight:900;
}

.blue{
  color:white;
  background:var(--blue);
}

.green{
  color:white;
  background:var(--green);
}

.gold{
  color:white;
  background:var(--gold);
}

.ghost{
  color:var(--ink);
  background:#EDF2F5;
}

.danger{
  color:var(--red);
  background:#FFF0F1;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:9px;
  margin-top:15px;
}

/* =========================
   PEOPLE
========================= */

.person{
  display:flex;
  align-items:center;
  gap:15px;
}

.avatar{
  width:86px;
  height:86px;
  flex:none;
  object-fit:cover;
  border:3px solid white;
  border-radius:50%;
  background:#EAF0F3;
  box-shadow:0 5px 15px rgba(7,26,43,.12);
}

.avatar.big{
  width:125px;
  height:125px;
}

.name{
  font-size:21px;
  font-weight:900;
}

.bio{
  margin-top:12px;
  line-height:1.5;
}

.goal{
  display:inline-block;
  margin-top:8px;
  padding:6px 10px;
  border-radius:99px;
  color:#08766F;
  background:#E6F5F1;
  font-size:13px;
  font-weight:900;
}

.online{
  margin-top:3px;
  color:var(--green);
  font-size:12px;
  font-weight:900;
}

.empty{
  padding:35px;
  color:var(--muted);

  font-weight:800;
}

.pillrow{
  display:flex;

}

.pill{

  font-size:12px;
  font-weight:800;
}

/* =========================
   AUTH
========================= */

.auth{

}

.authbox{

  border-radius:30px;
  background:white;

}

.logo-mark{

.logo-mark svg{

.auth-title{

.auth-title span{

.logo-by{

.sub{

}

.error{

.link{

/* =========================

.chatrow .avatar{

.mine{

.theirs{

.small{

.composer .input{

.attach,

.attach{

  background:#EDF2F5;
  font-size:20px;
}

.send{
  width:50px;
  color:white;
  background:var(--green);
}

.typing{

  font-size:12px;
  font-weight:800;
}

/* =========================
   PROFILE
========================= */

.profile-cover{

  padding:22px;
  border-radius:22px;
  color:white;
  text-align:center;

}

.avatar-wrap{
  position:relative;
  display:inline-block;
}

.camera{
  position:absolute;
  right:3px;
  bottom:5px;
  width:35px;
  height:35px;
  border-radius:50%;
  color:white;
  background:var(--gold);

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  z-index:40;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.6);
}

.modal.show{

}

.modalbox{
  width:min(540px,100%);

  overflow:auto;
  padding:22px;
  border-radius:25px;
  background:white;
}

.modalhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.close{
  width:40px;
  height:40px;
  border-radius:12px;
  color:var(--ink);
  background:#EDF2F5;
  font-size:22px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  z-index:100;
  top:16px;
  left:50%;
  display:none;
  max-width:90%;
  padding:12px 16px;
  transform:translateX(-50%);
  border-radius:14px;
  color:white;
  background:var(--navy);
  font-weight:800;
}

/* =========================

  .logo-mark{
    width:90px;

  }

/* =========================================================

========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(char){

        const map = {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"
        };

        return map[char];

      }
    );

}


function errorMessage(error){

  return (
    error?.message ||
    error?.error_description ||
    "Something went wrong."
  );

}


function toast(message){

  toastBox.textContent =
    message;

  toastBox.style.display =
    "block";

  clearTimeout(
    window.offaToastTimer
  );

  window.offaToastTimer =
    setTimeout(
      function(){

        toastBox.style.display =
          "none";

      },
      3000
    );

}


/* =========================================================
   AVATAR
========================================================= */

function avatar(profile){

  if(
    profile &&
    profile.avatar_url
  ){

    return profile.avatar_url;

  }

  return (
    "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(`
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="200"
        height="200">

          height="100%"

/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const email =
    document
      .getElementById("aEmail")
      ?.value
      .trim();

  const password =
    document
      .getElementById("aPass")
      ?.value;

  if(!email || !password){

    showAuth(
      false,
      "Enter your email and password."
    );

    return;

  }

  try{

    const result =
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if(result.error){
      throw result.error;
    }

    session =
      result.data.session;

    await boot();

  }catch(error){

    showAuth(
      false,
      errorMessage(error)
    );

  }

}


/* =========================================================
   SIGN UP
========================================================= */

async function signup(){

  const name =
    document
      .getElementById("aName")
      ?.value
      .trim();

  const age =
    Number(
      document
        .getElementById("aAge")
        ?.value
    );

  const sex =
    document
      .getElementById("aSex")
      ?.value ||
    null;

  const email =
    document
      .getElementById("aEmail")
      ?.value
      .trim();

  const password =
    document
      .getElementById("aPass")
      ?.value;

  if(
    !name ||
    !age ||
    age < 18 ||
    !email ||
    !password ||
    password.length < 6
  ){

    showAuth(
      true,
      "Enter your name, age 18+, email and a password of at least 6 characters."
    );

    return;

  }

  try{

    const result =
      await sb.auth.signUp({
        email,
        password
      });

    if(result.error){
      throw result.error;
    }

    if(!result.data.session){

      showAuth(
        false,
        "Account created. Check your email to confirm your account, then log in."
      );

      return;

    }

    session =
      result.data.session;

    const profile =
      await sb
        .from("profiles")

          id:result.data.user.id,
          name:name,

async function loadMatches(){

    await sb
      .from("matches")
      .select(
        `
          id,
          user_one,
          user_two,
          user_one_profile:profiles!matches_user_one_fkey(*),
          user_two_profile:profiles!matches_user_two_fkey(*)
        `
      )
      .or(
        `user_one.eq.${session.user.id},user_two.eq.${session.user.id}`
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(result.error){
    throw result.error;
  }

  matches =
    (result.data || [])
      .map(
        function(match){

          return {

            ...match,

            person:
              match.user_one ===
              session.user.id
              ?
              match.user_two_profile
              :
              match.user_one_profile

          };

        }
      );

}

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(!selected){
    return;
  }

  const input =
    document.getElementById(
      "chatInput"
    );

  const text =
    (input?.value || "")
      .trim();

  if(!text && !file){
    return;
  }

  try{

    let attachment = {};

    if(file){

      if(
        file.size >
        15 * 1024 * 1024
      ){

        throw new Error(
          "File must be 15 MB or smaller."
        );

      }

      const safeName =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );

      const path =
        `${session.user.id}/${selected.id}/${Date.now()}-${safeName}`;

      const upload =
        await sb.storage
          .from("chat-attachments")
          .upload(
            path,
            file,
            {
              contentType:
                file.type ||
                "application/octet-stream",
              upsert:false
            }
          );

      if(upload.error){
        throw upload.error;
      }

      const publicURL =
        sb.storage
          .from("chat-attachments")
          .getPublicUrl(
            path
          );

      attachment = {

        attachment_url:
          publicURL.data.publicUrl,

        attachment_name:
          safeName,

        attachment_type:
          file.type ||
          "application/octet-stream"

      };

    }

    const result =
      await sb
        .from("messages")
        .insert({
          match_id:
            selected.id,
          sender_id:
            session.user.id,
          message:
            text,
          ...attachment
        })
        .select()
        .single();

    if(result.error){
      throw result.error;
    }

    if(
      !messages.some(
        message =>
          message.id ===
          result.data.id
      )
    ){

      messages.push(
        result.data
      );

    }

    file = null;

    render();

    scrollMessages();

  }catch(error){

    toast(
      "Send failed: " +
      errorMessage(error)
    );

  }

}

/* =========================================================
   ONLINE STATUS
========================================================= */

function isOnline(profile){

  if(
    !profile?.last_seen_at
  ){

    return false;

  }

  return (
    Date.now() -
    new Date(
      profile.last_seen_at
    ).getTime()
  ) < 120000;

}


function startPresence(){

  clearInterval(
    presenceTimer
  );

  async function heartbeat(){

    if(!session){
      return;
    }

    try{

      await sb
        .from("profiles")
        .update({
          last_seen_at:
            new Date().toISOString()
        })
        .eq(
          "id",
          session.user.id
        );

    }catch(error){

      console.warn(
        "Presence update failed:",
        error
      );

    }

  }

  heartbeat();

  presenceTimer =
    setInterval(
      heartbeat,
      45000
    );

}


/* =========================================================
   REALTIME MESSAGES
========================================================= */

function subscribeRealtime(){

  if(messageChannel){

    sb.removeChannel(
      messageChannel
    );

  }

  messageChannel =
    sb
      .channel(
        "offa-messages-" +
        session.user.id
      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        async function(payload){

          if(
            selected &&
            payload.new.match_id ===
            selected.id &&
            !messages.some(
              message =>
                message.id ===
                payload.new.id
            )
          ){

            messages.push(
              payload.new
            );

            render();

            await markRead();

            scrollMessages();

          }

          try{

            await loadMatches();

          }catch(error){

            console.warn(error);

          }

        }
      )

      .subscribe();

}

/* =========================================================

async function uploadAvatar(input){

  const selectedFile =
    input.files?.[0];

  if(!selectedFile){
    return;
  }

  if(
    selectedFile.size >
    8 * 1024 * 1024
  ){

    toast(
      "Profile photo must be 8 MB or smaller."
    );

    return;

  }

  try{

    const extension =
      (
        selectedFile.name
          .split(".")
          .pop() ||
        "jpg"
      )
      .replace(
        /[^a-z0-9]/gi,
        ""
      );

    const path =
      `${session.user.id}/avatar-${Date.now()}.${extension}`;

    const upload =
      await sb.storage
        .from("avatars")
        .upload(
          path,
          selectedFile,
          {
            contentType:
              selectedFile.type ||
              "image/jpeg",
            upsert:false
          }
        );

    if(upload.error){
      throw upload.error;
    }

    const publicURL =
      sb.storage
        .from("avatars")
        .getPublicUrl(
          path
        );

    const result =
      await sb
        .from("profiles")
        .update({
          avatar_url:
            publicURL.data.publicUrl
        })
        .eq(
          "id",
          session.user.id
        )
        .select()
        .single();

    if(result.error){
      throw result.error;
    }

    me =
      result.data;

    await loadPeople();

    toast(
      "Profile photo updated."
    );

    render();

  }catch(error){

    toast(
      "Photo upload failed: " +
      errorMessage(error)
    );

  }

}

/* =========================================================
   SAVE PROFILE
========================================================= */

async function saveProfile(){

  const payload = {

    name:
      document
        .getElementById("eName")
        .value
        .trim(),

    age:
      Number(
        document
          .getElementById("eAge")
          .value
      ),

    city:
      document
        .getElementById("eCity")
        .value
        .trim() ||
      "Offa",

    sex:
      document
        .getElementById("eSex")
        .value ||
      null,

    relationship_goal:
      document
        .getElementById("eGoal")
        .value ||
      null,

    bio:
      document
        .getElementById("eBio")
        .value
        .trim()

  };

  if(
    !payload.name ||
    payload.age < 18
  ){

    toast(
      "Name and age 18+ are required."
    );

    return;

  }

  try{

    const result =
      await sb
        .from("profiles")
        .update(payload)
        .eq(
          "id",
          session.user.id
        )
        .select()
        .single();

    if(result.error){
      throw result.error;
    }

    me =
      result.data;

    document
      .getElementById("editModal")
      ?.remove();

    await loadPeople();

    render();

    toast(
      "Profile saved."
    );

  }catch(error){

    toast(
      "Save failed: " +
      errorMessage(error)
    );

  }

}


/* =========================================================
   BLOCK
========================================================= */

async function blockUser(id){

  if(
    !confirm(
      "Block this person? They will no longer appear in your discovery or chat list."
    )
  ){

    return;

  }

  try{

    const result =
      await sb
        .from("blocks")
        .insert({
          blocker_id:
            session.user.id,
          blocked_id:
            id
        });

    if(
      result.error &&
      !result.error.message
        .toLowerCase()
        .includes("duplicate")
    ){

      throw result.error;

    }

    people =
      people.filter(
        p=>p.id!==id
      );

    matches =
      matches.filter(
        match =>
          match.person?.id !== id
      );

    if(
      selected?.person?.id === id
    ){

      selected = null;

    }

    toast(
      "Person blocked."
    );

    render();

  }catch(error){

    toast(
      "Block failed: " +
      errorMessage(error)
    );

  }

}


/* =========================================================
   REPORT
========================================================= */

async function reportUser(id){

  const reason =
    prompt(
      "Reason for report?",
      "Inappropriate behavior"
    );

  if(!reason){
    return;
  }

  const details =
    prompt(
      "Additional details (optional):",
      ""
    );

  try{

    const result =
      await sb
        .from("reports")
        .insert({
          reporter_id:
            session.user.id,
          reported_id:
            id,
          reason:reason,
          details:
            details || null
        });

    if(result.error){
      throw result.error;
    }

    toast(
      "Report submitted."
    );

  }catch(error){

    toast(
      "Report failed: " +
      errorMessage(error)
    );

  }

}


/* =========================================================
   NAVIGATION
========================================================= */

async function go(destination){

  tab =
    destination;

  if(destination !== "chat"){
    selected = null;
  }

  try{

    if(destination === "discover"){

      await loadPeople();

    }

    if(
      destination === "matches" ||
      destination === "chat"
    ){

      await loadMatches();

    }

    render();

  }catch(error){

    toast(
      errorMessage(error)
    );

  }

}

/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  try{

    if(messageChannel){

      await sb.removeChannel(
        messageChannel
      );

      messageChannel = null;

    }

    clearInterval(
      presenceTimer
    );

    await sb.auth.signOut();

    session = null;
    me = null;
    people = [];
    matches = [];
    selected = null;
    messages = [];

    showAuth();

  }catch(error){

    toast(
      "Logout failed: " +
      errorMessage(error)
    );

  }

}


/* =========================================================
   INITIAL SESSION
========================================================= */

async function startApp(){

  if(!sb){

    showFatalError(
      new Error(
        "Supabase could not be initialized."
      )
    );

    return;

  }

  try{

    const result =
      await sb.auth.getSession();

    if(result.error){
      throw result.error;
    }

    session =
      result.data.session;

    if(session){

      await boot();

    }else{

      showAuth();

    }

  }catch(error){

    showFatalError(error);

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

if(sb){

  sb.auth.onAuthStateChange(
    function(event,newSession){

      session =
        newSession;

      if(
        event === "SIGNED_OUT"
      ){

        me = null;
        people = [];
        matches = [];
        selected = null;
        messages = [];

        showAuth();

      }

    }
  );

}


/* =========================================================
   START
========================================================= */

startApp();

</script>
