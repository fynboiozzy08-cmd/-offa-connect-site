<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offa Connect by Leo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --navy:#071A2B;
  --blue:#0B5C8E;
  --teal:#0B8F87;
  --green:#18A06A;
  --gold:#D9A441;
  --cream:#F7F4EE;
  --ink:#132235;
  --muted:#6E7D8C;
  --line:#E4EAF0;
  --red:#C83D4B;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(145deg,#061827,#0B5C8E,#0B8F87);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  min-height:100vh
}

button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}

.app{
  max-width:1000px;
  margin:auto;
  min-height:100vh;
  padding-bottom:88px
}

.top{
  color:#fff;
  padding:25px 20px
}

.brand{
  font-size:32px;
  font-weight:900
}

.brand b{color:var(--gold)}

.tag{
  font-weight:700;
  color:#d9e6ed;
  margin-top:4px
}

.shell{
  background:var(--cream);
  margin:0 12px;
  border-radius:30px;
  min-height:calc(100vh - 145px);
  overflow:hidden
}

.content{padding:20px}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 12px 35px #071a2b12
}

h1{
  margin:0 0 17px;
  font-size:31px
}

h2{
  margin:0 0 14px
}

.input,
.select,
.textarea,
.search{
  width:100%;
  padding:14px;
  border:2px solid var(--line);
  border-radius:16px;
  background:#fff;
  outline:none
}

.textarea{
  min-height:100px;
  resize:vertical
}

.search:focus,
.input:focus,
.select:focus,
.textarea:focus{
  border-color:var(--teal)
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px
}

.person{
  display:flex;
  align-items:center;
  gap:15px
}

.avatar{
  width:86px;
  height:86px;
  border-radius:50%;
  object-fit:cover;
  background:#eaf0f3;
  border:3px solid #fff;
  box-shadow:0 5px 15px #071a2b16
}

.avatar.big{
  width:125px;
  height:125px
}

.name{
  font-size:21px;
  font-weight:900
}

.meta{
  color:var(--muted);
  font-weight:700
}

.bio{
  margin-top:12px;
  line-height:1.5
}

.goal{
  display:inline-block;
  background:#e6f5f1;
  color:#08766f;
  border-radius:99px;
  padding:6px 10px;
  margin-top:8px;
  font-size:13px;
  font-weight:900
}

.actions{
  display:flex;
  gap:9px;
  justify-content:flex-end;
  margin-top:15px;
  flex-wrap:wrap
}

.btn{
  padding:13px 17px;
  border-radius:15px;
  font-weight:900
}

.green{
  background:var(--green);
  color:#fff
}

.blue{
  background:var(--blue);
  color:#fff
}

.ghost{
  background:#edf2f5;
  color:var(--ink)
}

.gold{
  background:var(--gold);
  color:#fff
}

.danger{
  background:#fff0f1;
  color:var(--red)
}

.empty{
  text-align:center;
  padding:35px;
  color:var(--muted);
  font-weight:800
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(1000px,100%);
  background:#fffffff5;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:9px 8px calc(9px + env(safe-area-inset-bottom));
  z-index:20
}

.nav{
  background:none;
  color:var(--muted);
  font-weight:900;
  padding:5px
}

.nav.active{
  color:var(--blue)
}

.ni{
  font-size:21px;
  display:block
}

.nl{
  font-size:12px
}

.badge{
  background:var(--gold);
  color:white;
  border-radius:20px;
  padding:2px 6px;
  font-size:10px
}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px
}

.authbox{
  width:min(520px,100%);
  background:#fff;
  border-radius:30px;
  padding:30px;
  box-shadow:0 25px 70px #0005
}

.authlogo{
  font-size:44px;
  font-weight:950
}

.authlogo b{
  color:var(--gold)
}

.sub{
  color:var(--muted);
  font-size:18px;
  margin:7px 0 23px
}

.stack{
  display:grid;
  gap:11px
}

.error{
  color:#c43d4b;
  font-weight:800;
  min-height:25px
}

.link{
  background:none;
  color:var(--blue);
  font-weight:900
}

.chatrow{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:18px;
  margin-bottom:9px
}

.chatrow .avatar{
  width:56px;
  height:56px
}

.messages{
  height:52vh;
  min-height:350px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:15px 2px
}

.bubble{
  max-width:80%;
  padding:11px 13px;
  border-radius:18px;
  word-break:break-word
}

.mine{
  align-self:flex-end;
  background:var(--blue);
  color:#fff;
  border-bottom-right-radius:5px
}

.theirs{
  align-self:flex-start;
  background:#edf2f5;
  border-bottom-left-radius:5px
}

.small{
  font-size:10px;
  opacity:.65;
  margin-top:4px
}

.photo{
  max-width:240px;
  border-radius:13px;
  display:block;
  margin-bottom:5px
}

.composer{
  display:flex;
  gap:7px;
  align-items:center;
  border-top:1px solid var(--line);
  padding-top:11px
}

.composer .input{
  flex:1
}

.attach,
.send{
  height:46px;
  border-radius:14px
}

.attach{
  width:46px;
  background:#edf2f5;
  font-size:20px
}

.send{
  width:50px;
  background:var(--green);
  color:#fff
}

.typing{
  font-size:12px;
  color:var(--teal);
  font-weight:800;
  height:18px
}

.online{
  color:var(--green);
  font-size:12px;
  font-weight:900
}

.profile-cover{
  background:linear-gradient(135deg,var(--navy),var(--teal));
  border-radius:22px;
  padding:22px;
  color:#fff;
  text-align:center;
  margin-bottom:15px
}

.avatar-wrap{
  position:relative;
  display:inline-block
}

.camera{
  position:absolute;
  right:3px;
  bottom:5px;
  width:35px;
  height:35px;
  border-radius:50%;
  background:var(--gold);
  color:#fff
}

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:40
}

.modal.show{
  display:flex
}

.modalbox{
  background:#fff;
  border-radius:25px;
  padding:22px;
  width:min(540px,100%);
  max-height:90vh;
  overflow:auto
}

.modalhead{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.close{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#edf2f5
}

.pillrow{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px
}

.pill{
  padding:8px 11px;
  border-radius:99px;
  background:#edf2f5;
  color:var(--ink);
  font-weight:800;
  font-size:12px
}

.toast{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  background:var(--navy);
  color:#fff;
  padding:12px 16px;
  border-radius:14px;
  z-index:100;
  font-weight:800;
  max-width:90%;
  display:none
}

@media(max-width:600px){
  .filters{
    grid-template-columns:1fr
  }

  .content{
    padding:15px
  }

  .shell{
    margin:0;
    border-radius:28px 28px 0 0
  }

  .authbox{
    padding:24px
  }

  .messages{
    height:49vh
  }
}
</style>
</head>

<body>

<div id="root"></div>
<div id="toast" class="toast"></div>

<script>

const SUPABASE_URL =
"https://irjahjpdjuvlmlcgtusr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HoMz0Vb4krVkz1p4Dm5_dg_hFuaxwxl";

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let session=null;
let me=null;
let people=[];
let matches=[];
let selected=null;
let messages=[];
let tab="discover";
let query="";
let goalFilter="";
let sexFilter="";
let minAge=18;
let maxAge=100;
let typingTimer=null;
let presenceTimer=null;
let messageChannel=null;
let file=null;

const $=id=>document.getElementById(id);

const esc=s=>
String(s??"").replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);

const avatar=p=>
p?.avatar_url ||
"data:image/svg+xml;charset=utf-8,"+
encodeURIComponent(
`<svg xmlns="http://www.w3.org/2000/svg"
width="200" height="200">
<rect width="100%" height="100%" fill="#e9eff3"/>
<text x="50%" y="58%"
text-anchor="middle"
font-size="80"
fill="#0B5C8E">♥</text>
</svg>`
);

function toast(t){

  $("toast").textContent=t;
  $("toast").style.display="block";

  clearTimeout(window.tt);

  window.tt=setTimeout(
    ()=>$("toast").style.display="none",
    2800
  );
}

function err(e){
  return e?.message ||
         e?.error_description ||
         "Something went wrong.";
}

function auth(sign=false,error=""){

root.innerHTML=`

<div class=auth>

<div class=authbox>

<div class=authlogo>
Offa <b>Connect</b>
</div>

<div class=sub>
<b>by Leo</b> · Meet. Connect. Belong.
</div>

<div class=error>
${esc(error)}
</div>

<div class=stack>

${
sign
?
`
<input
 id=aName
 class=input
 placeholder="Your name">

<input
 id=aAge
 class=input
 type=number
 min=18
 placeholder="Age">
`
:""
}

<input
 id=aEmail
 class=input
 type=email
 placeholder="Email address">

<input
 id=aPass
 class=input
 type=password
 placeholder="Password">

${
sign
?
`
<select id=aSex class=select>

<option value="">
Sex (optional)
</option>

<option>Male</option>
<option>Female</option>

</select>
`
:""
}

<button
 class="btn blue"
 onclick="${sign?"signup()":"login()"}">

${sign?"Create account":"Log in"}

</button>

</div>

<p style="text-align:center;color:var(--muted)">

${
sign
?"Already have an account?"
:"New to Offa Connect?"
}

<button
class=link
onclick="auth(${!sign})">

${sign?"Back to login":"Create account"}

</button>

</p>

</div>
</div>

`;
}

async function login(){

const email=$("aEmail").value.trim();
const password=$("aPass").value;

if(!email||!password)
return auth(
false,
"Enter your email and password."
);

const r=
await sb.auth.signInWithPassword({
  email,
  password
});

if(r.error)
return auth(false,err(r.error));

session=r.data.session;

await boot();
}

async function signup(){

const name=$("aName").value.trim();
const age=Number($("aAge").value);
const email=$("aEmail").value.trim();
const password=$("aPass").value;
const sex=$("aSex").value;

if(
!name ||
age<18 ||
!email ||
password.length<6
)
return auth(
true,
"Enter your name, age 18+, valid email and a password of at least 6 characters."
);

const r=
await sb.auth.signUp({
  email,
  password
});

if(r.error)
return auth(true,err(r.error));

if(!r.data.session)
return auth(
false,
"Account created. Check your email to confirm, then log in."
);

session=r.data.session;

const p=
await sb.from("profiles")
.upsert({
  id:r.data.user.id,
  name,
  age,
  city:"Offa",
  bio:"",
  sex:sex||null
});

if(p.error)
return auth(true,err(p.error));

await boot();
}

async function boot(){

await loadMe();
await loadPeople();
await loadMatches();

render();

startPresence();
subscribeRealtime();
}

async function loadMe(){

const r=
await sb.from("profiles")
.select("*")
.eq("id",session.user.id)
.single();

if(r.error)
throw r.error;

me=r.data;
}

async function loadPeople(){

const r=
await sb.from("profiles")
.select("*")
.neq("id",session.user.id)
.order("created_at",{ascending:false});

people=r.data||[];
}

async function loadMatches(){

const r=
await sb.from("matches")
.select(
"id,user_one,user_two,"+
"user_one_profile:profiles!matches_user_one_fkey(*),"+
"user_two_profile:profiles!matches_user_two_fkey(*)"
)
.or(
`user_one.eq.${session.user.id},user_two.eq.${session.user.id}`
)
.order(
"created_at",
{ascending:false}
);

matches=
(r.data||[]).map(m=>({
  ...m,
  person:
    m.user_one===session.user.id
    ?m.user_two_profile
    :m.user_one_profile
}));
}

async function loadMessages(){

if(!selected)return;

const r=
await sb.from("messages")
.select("*")
.eq("match_id",selected.id)
.order("created_at",{ascending:true});

messages=r.data||[];

render();

await markRead();

scrollMessages();
}

async function markRead(){

if(!selected)return;

await sb.from("messages")
.update({
  read_at:new Date().toISOString()
})
.eq("match_id",selected.id)
.neq("sender_id",session.user.id)
.is("read_at",null);
}

function scrollMessages(){

setTimeout(()=>{

const x=$("messages");

if(x)
x.scrollTop=x.scrollHeight;

},50);
}

function startPresence(){

clearInterval(presenceTimer);

const beat=async()=>{

await sb.from("profiles")
.update({
  last_seen_at:new Date().toISOString()
})
.eq("id",session.user.id);

};

beat();

presenceTimer=
setInterval(
beat,
45000
);
}

function subscribeRealtime(){

if(messageChannel)
sb.removeChannel(messageChannel);

messageChannel=
sb.channel(
"offa-messages-"+session.user.id
)

.on(
"postgres_changes",
{
event:"INSERT",
schema:"public",
table:"messages"
},
async p=>{

if(
selected &&
p.new.match_id===selected.id &&
!messages.some(
m=>m.id===p.new.id
)
){

messages.push(p.new);

render();

await markRead();

scrollMessages();

}

await loadMatches();

}
)

.subscribe();
}

function isOnline(p){

return p?.last_seen_at &&
Date.now()-
new Date(
p.last_seen_at
).getTime()
<120000;
}

function render(){

if(!session)
return auth();

root.innerHTML=`

<div class=app>

<header class=top>

<div class=brand>
Offa <b>Connect</b>
</div>

<div class=tag>
<b>by Leo</b> · Meet. Connect. Belong.
</div>

</header>

<main class=shell>

<section class=content>

${
tab==="discover"
?discoverView()
:tab==="matches"
?matchesView()
:tab==="chat"
?chatView()
:profileView()
}

</section>

</main>

<nav class=bottom>

<button
class="nav ${tab==="discover"?"active":""}"
onclick="go('discover')">

<span class=ni>♥</span>
<span class=nl>Discover</span>

</button>

<button
class="nav ${tab==="matches"?"active":""}"
onclick="go('matches')">

<span class=ni>
♡
${
matches.length
?`<span class=badge>${matches.length}</span>`
:""
}
</span>

<span class=nl>Matches</span>

</button>

<button
class="nav ${tab==="chat"?"active":""}"
onclick="go('chat')">

<span class=ni>▣</span>
<span class=nl>Chat</span>

</button>

<button
class="nav ${tab==="profile"?"active":""}"
onclick="go('profile')">

<span class=ni>●</span>
<span class=nl>Profile</span>

</button>

</nav>

</div>
`;
}

function discoverView(){

let list=people.filter(p=>{

const q=
!query ||
[
p.name,
p.city,
p.bio,
p.relationship_goal,
p.sex
]
.join(" ")
.toLowerCase()
.includes(
query.toLowerCase()
);

const g=
!goalFilter ||
p.relationship_goal===goalFilter;

const s=
!sexFilter ||
p.sex===sexFilter;

const a=
Number(p.age)>=minAge &&
Number(p.age)<=maxAge;

return q&&g&&s&&a;
});

return `

<div class=card>

<h1>Discover</h1>

<input
class=search
placeholder="Search by name, city or bio"
value="${esc(query)}"
oninput="query=this.value;render()"
>

<div class=filters>

<select
class=select
onchange="goalFilter=this.value;render()">

<option value="">
All goals
</option>

<option
${goalFilter==="Single"?"selected":""}>
Single
</option>

<option
${goalFilter==="Dating"?"selected":""}>
Dating
</option>

<option
${goalFilter==="Relationship"?"selected":""}>
Relationship
</option>

<option
${goalFilter==="Friendship"?"selected":""}>
Friendship
</option>

</select>

<select
class=select
onchange="sexFilter=this.value;render()">

<option value="">
All sexes
</option>

<option
${sexFilter==="Male"?"selected":""}>
Male
</option>

<option
${sexFilter==="Female"?"selected":""}>
Female
</option>

</select>

</div>

<div class=filters>

<input
class=input
type=number
min=18
max=100
value="${minAge}"
onchange="minAge=Number(this.value)||18;render()"
placeholder="Min age">

<input
class=input
type=number
min=18
max=100
value="${maxAge}"
onchange="maxAge=Number(this.value)||100;render()"
placeholder="Max age">

</div>

</div>

${
list.map(profileCard).join("")
||
'<div class="card empty">No profiles match your filters.</div>'
}

`;
}

function profileCard(p){

return `

<div class=card>

<div class=person>

<img
class=avatar
src="${avatar(p)}">

<div style="flex:1">

<div class=name>
${esc(p.name)}, ${esc(p.age)}
</div>

<div class=meta>
📍 ${esc(p.city||"Offa")}
</div>

<div class=online>
${isOnline(p)?"● Online":"Recently active"}
</div>

${
p.relationship_goal
?`<span class=goal>
${esc(p.relationship_goal)}
</span>`
:""
}

</div>

</div>

${
p.bio
?`<div class=bio>${esc(p.bio)}</div>`
:""
}

${
p.sex
?`<div class=pillrow>
<span class=pill>${esc(p.sex)}</span>
</div>`
:""
}

<div class=actions>

<button
class="btn danger"
onclick="blockUser('${p.id}')">
Block
</button>

<button
class="btn ghost"
onclick="passProfile('${p.id}')">
✕ Pass
</button>

<button
class="btn green"
onclick="likeProfile('${p.id}')">
♥ Like
</button>

</div>

</div>

`;
}

async function likeProfile(id){

const r=
await sb.from("likes")
.insert({
  from_user:session.user.id,
  to_user:id
});

if(
r.error &&
!r.error.message
.toLowerCase()
.includes("duplicate")
)
return toast(err(r.error));

people=
people.filter(
p=>p.id!==id
);

await loadMatches();

toast("Like sent ♥");

render();
}

function passProfile(id){

people=
people.filter(
p=>p.id!==id
);

render();
}

function matchesView(){

return `

<div class=card>

<h1>Your Matches</h1>

<div class=meta>
Start a conversation with someone you matched with.
</div>

</div>

${
matches.map(m=>`

<div
class=chatrow
onclick="openChat(${m.id})">

<img
class=avatar
src="${avatar(m.person)}">

<div style="flex:1">

<div class=name>
${esc(m.person?.name||"Match")}
</div>

<div class=meta>
${esc(m.person?.city||"Offa")}
</div>

<div class=online>
${isOnline(m.person)
?"● Online"
:"Recently active"}
</div>

</div>

<b style="color:var(--blue)">
Chat ›
</b>

</div>

`).join("")

||

'<div class="card empty">No matches yet. Keep discovering.</div>'

}

`;
}

function chatView(){

if(!selected)

return `

<div class=card>

<h1>Chat</h1>

<div class=meta>
Choose a match to start chatting.
</div>

</div>

${
matches.map(m=>`

<div
class=chatrow
onclick="openChat(${m.id})">

<img
class=avatar
src="${avatar(m.person)}">

<div>

<div class=name>
${esc(m.person?.name)}
</div>

<div class=online>
${isOnline(m.person)
?"● Online"
:"Recently active"}
</div>

</div>

</div>

`).join("")

||

'<div class="card empty">No matches yet.</div>'

}`;

const p=selected.person;

return `

<div class=card>

<div class=person>

<button
class=close
onclick="selected=null;render()">
‹
</button>

<img
class=avatar
src="${avatar(p)}">

<div style="flex:1">

<div class=name>
${esc(p?.name||"Match")}
</div>

<div class=online>
${isOnline(p)
?"● Online"
:"Recently active"}
</div>

</div>

<button
class=close
onclick="reportUser('${p.id}')">
⚑
</button>

</div>

<div id=typing class=typing></div>

<div
id=messages
class=messages>

${
messages.map(messageBubble).join("")

||

'<div class=empty>Say hello 👋</div>'
}

</div>

<div class=meta>

${
file
?
`Selected: ${esc(file.name)}
·
<button
class=link
onclick="clearFile()">
remove
</button>`
:
"Photos/files up to 15 MB."
}

</div>

<div class=composer>

<button
class=attach
onclick="$('chatFile').click()">
＋
</button>

<input
id=chatInput
class=input
placeholder="Write a message..."
oninput="sendTyping()"
onkeydown="if(event.key==='Enter')sendMessage()">

<input
id=chatFile
type=file
style="display:none"
onchange="filePicked(this)">

<button
class=send
onclick=sendMessage()>
➤
</button>

</div>

<div class=actions>

<button
class="btn danger"
onclick="blockUser('${p.id}')">

Block ${esc(p.name)}

</button>

</div>

</div>

`;
}

function messageBubble(m){

let body=esc(m.message||"");

if(m.attachment_url){

if(
(m.attachment_type||"")
.startsWith("image/")
){

body=
`
<img
class=photo
src="${esc(m.attachment_url)}"
alt="${esc(m.attachment_name||"photo")}">

${body}
`;

}else{

body=
`
<a
href="${esc(m.attachment_url)}"
target=_blank
rel=noopener
style="color:inherit;font-weight:900;display:block">

📎 ${esc(m.attachment_name||"Attachment")}

</a>

${body}
`;

}

}

return `

<div
class="bubble ${
m.sender_id===session.user.id
?"mine"
:"theirs"
}">

${body}

<div class=small>

${
new Date(
m.created_at
).toLocaleTimeString(
[],
{
hour:"numeric",
minute:"2-digit"
}
)
}

${
m.sender_id===session.user.id
?
(m.read_at
?" · Read"
:" · Sent")
:""
}

</div>

</div>

`;
}

async function openChat(id){

selected=
matches.find(
m=>m.id===id
)||null;

messages=[];

tab="chat";

render();

await loadMessages();
}

function filePicked(input){

file=
input.files?.[0]||null;

render();
}

function clearFile(){

file=null;

render();
}

async function sendMessage(){

if(!selected)return;

const input=$("chatInput");

const text=
(input?.value||"").trim();

if(!text&&!file)return;

let attachment={};

try{

if(file){

if(file.size>15*1024*1024)
throw Error(
"File must be 15 MB or smaller."
);

const safe=
file.name.replace(
/[^a-zA-Z0-9._-]/g,
"_"
);

const path=
`${session.user.id}/${selected.id}/${Date.now()}-${safe}`;

const u=
await sb.storage
.from("chat-attachments")
.upload(
path,
file,
{
contentType:
file.type||
"application/octet-stream",
upsert:false
}
);

if(u.error)
throw u.error;

const pub=
sb.storage
.from("chat-attachments")
.getPublicUrl(path);

attachment={
attachment_url:
pub.data.publicUrl,

attachment_name:
safe,

attachment_type:
file.type||
"application/octet-stream"
};

}

const r=
await sb.from("messages")
.insert({
  match_id:selected.id,
  sender_id:session.user.id,
  message:text,
  ...attachment
})
.select()
.single();

if(r.error)
throw r.error;

if(
!messages.some(
m=>m.id===r.data.id
)
)
messages.push(r.data);

file=null;

render();

scrollMessages();

}catch(e){

toast(
"Send failed: "+err(e)
);

}

}

function sendTyping(){

clearTimeout(typingTimer);

if(!selected)return;

localStorage.setItem(
"offa-typing-"+selected.id,
Date.now()
);

typingTimer=
setTimeout(
()=>{
localStorage.removeItem(
"offa-typing-"+selected.id
);
},
1800
);
}

function profileView(){

return `

<div class=profile-cover>

<div class=avatar-wrap>

<img
class="avatar big"
src="${avatar(me)}">

<button
class=camera
onclick="$('avatarFile').click()">
✎
</button>

</div>

<input
id=avatarFile
type=file
accept="image/*"
style="display:none"
onchange="uploadAvatar(this)">

<h1
style="margin:12px 0 3px;color:#fff">

${esc(me.name)}

</h1>

<div style="opacity:.85">

${esc(me.age)}
·
${esc(me.city||"Offa")}

</div>

</div>

<div class=card>

<h2>My profile</h2>

${
me.bio
?`<p>${esc(me.bio)}</p>`
:
`<p class=meta>
Add a bio so people can get to know you.
</p>`
}

${
me.relationship_goal
?
`<span class=goal>
${esc(me.relationship_goal)}
</span>`
:""
}

<div class=actions>

<button
class="btn blue"
onclick=editProfile()>
Edit profile
</button>

<button
class="btn ghost"
onclick=logout()>
Log out
</button>

</div>

</div>

<div class=card>

<h2>Safety</h2>

<p class=meta>
Block or report anyone who makes you uncomfortable.
You control who you interact with.
</p>

</div>

`;
}

async function uploadAvatar(input){

const f=input.files?.[0];

if(!f)return;

if(f.size>8*1024*1024)
return toast(
"Profile photo must be 8 MB or smaller."
);

try{

const ext=
(
f.name.split(".").pop()||
"jpg"
)
.replace(
/[^a-z0-9]/gi,
""
);

const path=
`${session.user.id}/avatar-${Date.now()}.${ext}`;

const u=
await sb.storage
.from("avatars")
.upload(
path,
f,
{
contentType:
f.type||"image/jpeg",
upsert:false
}
);

if(u.error)
throw u.error;

const pub=
sb.storage
.from("avatars")
.getPublicUrl(path);

const r=
await sb.from("profiles")
.update({
  avatar_url:
  pub.data.publicUrl
})
.eq(
"id",
session.user.id
)
.select()
.single();

if(r.error)
throw r.error;

me=r.data;

await loadPeople();

toast(
"Profile photo updated."
);

render();

}catch(e){

toast(
"Photo upload failed: "+err(e)
);

}
}

async function editProfile(){

root.insertAdjacentHTML(
"beforeend",

`

<div
class="modal show"
id=editModal>

<div class=modalbox>

<div class=modalhead>

<h2>Edit profile</h2>

<button
class=close
onclick="editModal.remove()">
×
</button>

</div>

<div class=stack>

<label>Name</label>

<input
id=eName
class=input
value="${esc(me.name)}">

<label>Age</label>

<input
id=eAge
class=input
type=number
min=18
value="${me.age}">

<label>City</label>

<input
id=eCity
class=input
value="${esc(me.city||"Offa")}">

<label>Sex</label>

<select
id=eSex
class=select>

<option value="">
Prefer not to say
</option>

<option
${me.sex==="Male"?"selected":""}>
Male
</option>

<option
${me.sex==="Female"?"selected":""}>
Female
</option>

</select>

<label>
Relationship goal
</label>

<select
id=eGoal
class=select>

<option value="">
Choose
</option>

<option
${me.relationship_goal==="Single"?"selected":""}>
Single
</option>

<option
${me.relationship_goal==="Dating"?"selected":""}>
Dating
</option>

<option
${me.relationship_goal==="Relationship"?"selected":""}>
Relationship
</option>

<option
${me.relationship_goal==="Friendship"?"selected":""}>
Friendship
</option>

</select>

<label>Bio</label>

<textarea
id=eBio
class=textarea>
${esc(me.bio||"")}
</textarea>

<button
class="btn green"
onclick=saveProfile()>
Save profile
</button>

</div>

</div>

</div>

`
);
}

async function saveProfile(){

const payload={

name:$("eName").value.trim(),

age:Number(
$("eAge").value
),

city:
$("eCity").value.trim()||
"Offa",

sex:
$("eSex").value||
null,

relationship_goal:
$("eGoal").value||
null,

bio:
$("eBio").value.trim()

};

if(
!payload.name||
payload.age<18
)
return toast(
"Name and age 18+ are required."
);

const r=
await sb.from("profiles")
.update(payload)
.eq(
"id",
session.user.id
)
.select()
.single();

if(r.error)
return toast(
err(r.error)
);

me=r.data;

$("editModal").remove();

await loadPeople();

render();

toast(
"Profile saved."
);
}

async function blockUser(id){

if(
!confirm(
"Block this person? They will no longer appear in your discovery or chat list."
)
)
return;

const r=
await sb.from("blocks")
.insert({
  blocker_id:session.user.id,
  blocked_id:id
});

if(
r.error &&
!r.error.message
.toLowerCase()
.includes("duplicate")
)
return toast(
err(r.error)
);

people=
people.filter(
p=>p.id!==id
);

matches=
matches.filter(
m=>m.person?.id!==id
);

if(
selected?.person?.id===id
)
selected=null;

toast("Person blocked.");

render();
}

async function reportUser(id){

const reason=
prompt(
"Reason for report?",
"Inappropriate behavior"
);

if(!reason)return;

const details=
prompt(
"Additional details (optional):",
""
);

const r=
await sb.from("reports")
.insert({
  reporter_id:session.user.id,
  reported_id:id,
  reason,
  details
});

if(r.error)
return toast(
err(r.error)
);

toast(
"Report submitted."
);
}

async function go(t){

tab=t;

if(t!=="chat")
selected=null;

if(t==="discover")
await loadPeople();

if(
t==="matches"||
t==="chat"
)
await loadMatches();

render();
}

async function logout(){

await sb.auth.signOut();

session=null;
me=null;
people=[];
matches=[];
selected=null;

auth();
}

sb.auth.getSession()
.then(async r=>{

session=
r.data.session;

if(session){

try{

await boot();

}catch(e){

auth(
false,
err(e)
);

}

}else{

auth();

}

});

</script>

</body>
</html>
