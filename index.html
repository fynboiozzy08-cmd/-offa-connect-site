<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offa Connect by Leo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f7f4ee;
  color:#132235
}

button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}

:root{
  --navy:#071A2B;
  --blue:#0B5C8E;
  --teal:#0B8F87;
  --green:#18A06A;
  --gold:#D9A441;
  --cream:#F7F4EE;
  --white:#FFFFFF;
  --ink:#132235;
  --muted:#6E7D8C;
  --line:#E4EAF0;
}

.hidden{display:none!important}

.app{min-height:100vh}

.top{
  background:var(--navy);
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  font-weight:900;
  font-size:22px;
}

.tag{
  font-size:12px;
  opacity:.8;
  margin-top:2px;
}

.main{
  max-width:720px;
  margin:auto;
  padding:18px 14px 95px;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 5px 20px #071a2b0b;
}

.btn{
  background:var(--blue);
  color:white;
  padding:12px 16px;
  border-radius:12px;
  font-weight:800;
}

.btn.green{background:var(--green)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.gray{background:#edf1f4;color:var(--ink)}
.btn.danger{background:#c93636;color:white}

.row{
  display:flex;
  gap:10px;
  align-items:center;
}

.grow{flex:1}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  background:white;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:center;
  z-index:20;
}

.nav button{
  flex:1;
  max-width:180px;
  background:white;
  padding:13px 5px;
  color:var(--muted);
  font-size:12px;
}

.nav button.active{
  color:var(--blue);
  font-weight:900;
}

.avatar{
  width:56px;
  height:56px;
  border-radius:50%;
  overflow:hidden;
  background:#dceaf1;
  display:grid;
  place-items:center;
  font-weight:900;
  color:var(--blue);
  flex:none;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-card{
  display:flex;
  gap:14px;
  align-items:center;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  flex:1;
}

.match{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:15px;
  margin-bottom:10px;
}

.chat-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.messages{
  height:55vh;
  overflow:auto;
  background:#f1f5f7;
  border-radius:16px;
  padding:12px;
}

.bubble{
  max-width:78%;
  padding:10px 12px;
  border-radius:16px;
  margin:6px 0;
  word-break:break-word;
}

.mine{
  margin-left:auto;
  background:#d8f2e5;
  border-bottom-right-radius:5px;
}

.theirs{
  background:white;
  border-bottom-left-radius:5px;
}

.bubble img{
  max-width:100%;
  max-height:280px;
  border-radius:12px;
  display:block;
  margin-bottom:5px;
}

.attachment{
  display:flex;
  align-items:center;
  gap:8px;
  background:#f3f6f8;
  border-radius:10px;
  padding:9px;
  text-decoration:none;
  color:var(--ink);
}

.composer{
  display:flex;
  gap:7px;
  margin-top:10px;
  align-items:flex-end;
}

.composer textarea{
  min-height:46px;
  max-height:130px;
}

.attachbtn{
  width:46px;
  height:46px;
  border-radius:12px;
  background:#edf1f4;
  font-size:22px;
}

.send{
  width:54px;
  height:46px;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-weight:900;
}

.file-preview{
  font-size:12px;
  color:var(--muted);
  padding:4px 2px;
}

.auth{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:linear-gradient(150deg,var(--navy),#0b5c8e);
}

.authbox{
  width:min(440px,100%);
  background:white;
  border-radius:25px;
  padding:25px;
}

.logo{
  font-size:34px;
  font-weight:950;
  color:var(--navy);
}

.logo span{
  color:var(--gold);
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:var(--muted);
}

.toast{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  background:var(--navy);
  color:white;
  padding:11px 15px;
  border-radius:12px;
  z-index:99;
  display:none;
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<!-- AUTH -->
<section id="auth" class="auth">

  <div class="authbox">

    <div class="logo">
      Offa <span>Connect</span>
    </div>

    <p>
      <b>by Leo</b> · Meet. Connect. Belong.
    </p>

    <div id="authMsg" class="muted"></div>

    <div id="signupFields" class="hidden">

      <input
        id="signupName"
        placeholder="Full name"
      >

      <br><br>

      <input
        id="signupAge"
        type="number"
        min="18"
        placeholder="Age"
      >

      <br><br>

    </div>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <br><br>

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <br><br>

    <button
      id="authBtn"
      class="btn"
      style="width:100%"
    >
      Log in
    </button>

    <p style="text-align:center">

      <button
        id="toggleAuth"
        class="btn gray"
      >
        Create account
      </button>

    </p>

  </div>

</section>


<!-- APP -->
<div id="app" class="app hidden">

<header class="top">

  <div class="brand">
    Offa Connect by Leo
  </div>

  <div class="tag">
    Meet. Connect. Belong.
  </div>

</header>


<main class="main">


<!-- DISCOVER -->
<section id="page-discover">

  <div class="card">

    <h2>Discover</h2>

    <input
      id="search"
      placeholder="Search by name, city or bio"
    >

  </div>

  <div id="discoverList"></div>

</section>


<!-- MATCHES -->
<section
  id="page-matches"
  class="hidden"
>

  <div class="card">

    <h2>Your Matches</h2>

    <div id="matchesList"></div>

  </div>

</section>


<!-- CHAT -->
<section
  id="page-chat"
  class="hidden"
>

  <div class="card">

    <div
      id="chatEmpty"
      class="empty"
    >
      Open a match to start chatting.
    </div>


    <div
      id="chatBox"
      class="hidden"
    >

      <div class="chat-head">

        <button
          class="btn gray"
          onclick="showPage('matches')"
        >
          ←
        </button>

        <div
          id="chatAvatar"
          class="avatar"
        ></div>

        <div class="grow">

          <b id="chatName">
            Chat
          </b>

          <div
            id="chatStatus"
            class="muted"
          ></div>

        </div>

      </div>


      <div
        id="messages"
        class="messages"
      ></div>


      <div
        id="filePreview"
        class="file-preview"
      ></div>


      <form
        id="composer"
        class="composer"
      >

        <input
          id="fileInput"
          type="file"
          hidden
          multiple
        >

        <button
          type="button"
          class="attachbtn"
          onclick="document.getElementById('fileInput').click()"
        >
          📎
        </button>

        <textarea
          id="messageInput"
          placeholder="Write a message..."
        ></textarea>

        <button
          class="send"
          type="submit"
        >
          ➤
        </button>

      </form>

    </div>

  </div>

</section>


<!-- PROFILE -->
<section
  id="page-profile"
  class="hidden"
>

  <div class="card">

    <h2>My Profile</h2>

    <div class="row">

      <div
        id="myAvatar"
        class="avatar"
      ></div>

      <div class="grow">

        <input
          id="profileName"
          placeholder="Name"
        >

        <br><br>

        <input
          id="profileCity"
          placeholder="City"
        >

      </div>

    </div>

    <br>

    <input
      id="profileAge"
      type="number"
      min="18"
      placeholder="Age"
    >

    <br><br>

    <textarea
      id="profileBio"
      placeholder="Tell people about yourself"
    ></textarea>

    <br><br>

    <input
      id="avatarInput"
      type="file"
      accept="image/*"
    >

    <br><br>

    <button
      class="btn green"
      onclick="saveProfile()"
    >
      Save profile
    </button>

    <button
      class="btn danger"
      onclick="logout()"
      style="float:right"
    >
      Log out
    </button>

  </div>

</section>

</main>


<!-- NAV -->
<nav class="nav">

  <button
    id="nav-discover"
    class="active"
    onclick="showPage('discover')"
  >
    ♥<br>
    Discover
  </button>

  <button
    id="nav-matches"
    onclick="showPage('matches')"
  >
    ♡<br>
    Matches
  </button>

  <button
    id="nav-chat"
    onclick="showPage('chat')"
  >
    ▣<br>
    Chat
  </button>

  <button
    id="nav-profile"
    onclick="showPage('profile')"
  >
    ●<br>
    Profile
  </button>

</nav>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://irjahjpdjuvlmlcgtusr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HoMz0Vb4krVkz1p4Dm5_dg_hFuaxwxl";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   APP STATE
========================= */

let session = null;
let profile = null;
let signup = false;
let selectedMatch = null;
let realtime = null;

window.offaMatches = {};


/* =========================
   HELPERS
========================= */

const $ = id =>
  document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


function initials(name){

  return (name || "OC")
    .split(/\s+/)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();

}


function toast(message){

  $("toast").textContent = message;

  $("toast").style.display = "block";

  setTimeout(() => {

    $("toast").style.display = "none";

  },2600);

}


function avatarHtml(p){

  if(p?.avatar_url){

    return `
      <img
        src="${esc(p.avatar_url)}"
        alt=""
      >
    `;

  }

  return esc(initials(p?.name));

}


/* =========================
   NAVIGATION
========================= */

function showPage(page){

  [
    "discover",
    "matches",
    "chat",
    "profile"
  ].forEach(p => {

    $("page-"+p)
      .classList
      .toggle("hidden",p !== page);

    $("nav-"+p)
      .classList
      .toggle("active",p === page);

  });


  if(page === "discover")
    loadDiscover();

  if(page === "matches")
    loadMatches();


  if(
    page === "chat" &&
    !selectedMatch
  ){

    $("chatEmpty")
      .classList
      .remove("hidden");

    $("chatBox")
      .classList
      .add("hidden");

  }

}


/* =========================
   AUTH
========================= */

function setAuthMode(){

  $("signupFields")
    .classList
    .toggle("hidden",!signup);

  $("authBtn").textContent =
    signup
      ? "Create account"
      : "Log in";

  $("toggleAuth").textContent =
    signup
      ? "Back to login"
      : "Create account";

}


$("toggleAuth").onclick = () => {

  signup = !signup;

  setAuthMode();

};


$("authBtn").onclick = async () => {

  $("authMsg").textContent =
    "Working...";

  try{

    if(signup){

      const email =
        $("email").value.trim();

      const password =
        $("password").value;

      const name =
        $("signupName").value.trim();

      const age =
        Number($("signupAge").value);


      if(!name || age < 18){

        throw Error(
          "Enter your name and an age of 18 or older."
        );

      }


      const {
        data,
        error
      } =
      await db.auth.signUp({
        email,
        password
      });


      if(error)
        throw error;


      if(data.user){

        const {
          error:e
        } =
        await db
          .from("profiles")
          .upsert({
            id:data.user.id,
            name,
            age,
            city:"Offa",
            bio:""
          });


        if(e)
          throw e;

      }


      toast(
        "Account created. Check your email if confirmation is required."
      );

    }else{

      const {
        error
      } =
      await db.auth.signInWithPassword({

        email:
          $("email").value.trim(),

        password:
          $("password").value

      });


      if(error)
        throw error;

    }


    $("authMsg").textContent = "";

  }catch(error){

    $("authMsg").textContent =
      error.message;

  }

};


/* =========================
   START
========================= */

async function start(){

  const {
    data
  } =
  await db.auth.getSession();

  session =
    data.session;

  await updateUI();


  db.auth.onAuthStateChange(
    async (_event,newSession) => {

      session =
        newSession;

      await updateUI();

    }
  );

}


async function updateUI(){

  if(!session){

    $("auth")
      .classList
      .remove("hidden");

    $("app")
      .classList
      .add("hidden");

    return;

  }


  $("auth")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");


  await loadMyProfile();

  showPage("discover");

}


/* =========================
   PROFILE
========================= */

async function loadMyProfile(){

  const {
    data,
    error
  } =
  await db
    .from("profiles")
    .select("*")
    .eq("id",session.user.id)
    .maybeSingle();


  if(error)
    toast(error.message);


  profile = data;


  if(!profile){

    const newProfile = {

      id:
        session.user.id,

      name:
        session.user.email
          ?.split("@")[0] ||
        "Member",

      age:18,

      city:"Offa",

      bio:""

    };


    const result =
      await db
        .from("profiles")
        .insert(newProfile)
        .select()
        .single();


    profile =
      result.data;

  }


  if(profile){

    $("profileName").value =
      profile.name || "";

    $("profileAge").value =
      profile.age || 18;

    $("profileCity").value =
      profile.city || "Offa";

    $("profileBio").value =
      profile.bio || "";


    $("myAvatar").innerHTML =
      avatarHtml(profile);

  }

}


/* =========================
   DISCOVER
========================= */

async function loadDiscover(){

  const q =
    $("search").value.trim();


  const query =
    db
      .from("profiles")
      .select("*")
      .neq("id",session.user.id)
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(50);


  const {
    data,
    error
  } =
  await query;


  if(error){

    $("discoverList").innerHTML =
      `<div class="card">
        ${esc(error.message)}
      </div>`;

    return;

  }


  const rows =
    (data || []).filter(p => {

      if(!q)
        return true;


      return [
        p.name,
        p.city,
        p.bio
      ]
      .join(" ")
      .toLowerCase()
      .includes(q.toLowerCase());

    });


  $("discoverList").innerHTML =
    rows.length

    ?

    rows.map(p => `

      <div class="card profile-card">

        <div class="avatar">

          ${avatarHtml(p)}

        </div>


        <div class="grow">

          <h3 style="margin:0">
            ${esc(p.name)}
          </h3>

          <div class="muted">

            ${esc(p.age || "")}
            ·
            ${esc(p.city || "Offa")}

          </div>


          <p>
            ${esc(p.bio || "")}
          </p>

        </div>


        <div>

          <button
            class="btn green"
            onclick="likeProfile('${p.id}')"
          >
            ♥ Like
          </button>

          <br><br>

          <button
            class="btn gray"
            onclick="this.closest('.card').remove()"
          >
            × Pass
          </button>

        </div>

      </div>

    `).join("")

    :

    `
      <div class="card empty">
        No members found.
      </div>
    `;

}


$("search")
  .addEventListener(
    "input",
    loadDiscover
  );


/* =========================
   LIKE
========================= */

async function likeProfile(id){

  const {
    error
  } =
  await db
    .from("likes")
    .upsert(
      {
        from_user:
          session.user.id,

        to_user:
          id
      },
      {
        onConflict:
          "from_user,to_user"
      }
    );


  if(error){

    toast(error.message);

    return;

  }


  toast("Like sent ♥");


  const {
    data
  } =
  await db
    .from("matches")
    .select("*")
    .or(
      `user_one.eq.${session.user.id},user_two.eq.${session.user.id}`
    );


  if(
    (data || [])
      .some(
        m =>
          m.user_one === id ||
          m.user_two === id
      )
  ){

    toast("It's a match! ♥");

  }

}


/* =========================
   MATCHES
========================= */

async function loadMatches(){

  const box =
    $("matchesList");


  box.innerHTML =
    "<div class='muted'>Loading...</div>";


  const {
    data:matches,
    error
  } =
  await db
    .from("matches")
    .select("*")
    .or(
      `user_one.eq.${session.user.id},user_two.eq.${session.user.id}`
    )
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    box.innerHTML =
      `<div class="muted">
        ${esc(error.message)}
      </div>`;

    return;

  }


  if(!matches?.length){

    box.innerHTML =
      `
        <div class="empty">
          No matches yet.
        </div>
      `;

    return;

  }


  const ids =
    matches.map(
      m =>
        m.user_one === session.user.id
          ? m.user_two
          : m.user_one
    );


  const {
    data:profiles,
    error:profileError
  } =
  await db
    .from("profiles")
    .select("*")
    .in("id",ids);


  if(profileError){

    box.innerHTML =
      esc(profileError.message);

    return;

  }


  const map =
    Object.fromEntries(
      (profiles || [])
        .map(
          p => [p.id,p]
        )
    );


  window.offaMatches = {};


  box.innerHTML =
    matches
      .map(match => {

        const otherId =
          match.user_one === session.user.id
            ? match.user_two
            : match.user_one;


        const p =
          map[otherId];


        if(!p)
          return "";


        window.offaMatches[
          String(match.id)
        ] = {

          matchId:
            match.id,

          profile:
            p

        };


        return `

          <div class="match">

            <div class="avatar">
              ${avatarHtml(p)}
            </div>


            <div class="grow">

              <b>
                ${esc(p.name)}
              </b>

              <div class="muted">
                ${esc(p.city || "Offa")}
              </div>

            </div>


            <button
              class="btn"
              onclick="openChat('${match.id}')"
            >
              Chat
            </button>

          </div>

        `;

      })
      .join("");

}


/* =========================
   OPEN CHAT
========================= */

async function openChat(id){

  selectedMatch =
    window.offaMatches[
      String(id)
    ];


  if(!selectedMatch){

    toast(
      "Refresh your matches and try again."
    );

    return;

  }


  showPage("chat");


  $("chatEmpty")
    .classList
    .add("hidden");


  $("chatBox")
    .classList
    .remove("hidden");


  const p =
    selectedMatch.profile;


  $("chatName").textContent =
    p.name || "Chat";


  $("chatStatus").textContent =
    p.city || "";


  $("chatAvatar").innerHTML =
    avatarHtml(p);


  await loadMessages();

  subscribe();

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(!selectedMatch)
    return;


  const {
    data,
    error
  } =
  await db
    .from("messages")
    .select("*")
    .eq(
      "match_id",
      selectedMatch.matchId
    )
    .order(
      "created_at",
      {ascending:true}
    );


  if(error){

    $("messages").innerHTML =
      `
        <div class="empty">
          ${esc(error.message)}
        </div>
      `;

    return;

  }


  $("messages").innerHTML =
    (data || [])
      .map(messageHtml)
      .join("")


    ||

    `
      <div class="empty">
        No messages yet.
        Say hello 👋
      </div>
    `;


  $("messages").scrollTop =
    $("messages").scrollHeight;


  const unread =
    (data || [])
      .filter(
        m =>
          m.sender_id !== session.user.id &&
          !m.read_at
      )
      .map(
        m => m.id
      );


  if(unread.length){

    await db
      .from("messages")
      .update({
        read_at:
          new Date().toISOString()
      })
      .in(
        "id",
        unread
      );

  }

}


/* =========================
   MESSAGE DISPLAY
========================= */

function messageHtml(m){

  const mine =
    m.sender_id === session.user.id;


  let body = "";


  if(m.attachment_url){

    if(
      (m.attachment_type || "")
        .startsWith("image/")
    ){

      body += `

        <a
          href="${esc(m.attachment_url)}"
          target="_blank"
          rel="noopener"
        >

          <img
            src="${esc(m.attachment_url)}"
            alt="${esc(
              m.attachment_name ||
              "image"
            )}"
          >

        </a>

      `;

    }else{

      body += `

        <a
          class="attachment"
          href="${esc(m.attachment_url)}"
          target="_blank"
          rel="noopener"
        >

          📎
          ${esc(
            m.attachment_name ||
            "Attachment"
          )}

        </a>

      `;

    }

  }


  if(m.message){

    body += `

      <div>
        ${esc(m.message)}
      </div>

    `;

  }


  return `

    <div
      class="bubble ${
        mine
          ? "mine"
          : "theirs"
      }"
    >

      ${body}

      <div
        class="muted"
        style="margin-top:4px"
      >

        ${
          mine
            ? (
                m.read_at
                  ? "Seen"
                  : "Sent"
              )
            : ""
        }

      </div>

    </div>

  `;

}


/* =========================
   REALTIME CHAT
========================= */

function subscribe(){

  if(realtime)
    db.removeChannel(realtime);


  realtime =
    db
      .channel(
        "offa-chat-" +
        selectedMatch.matchId +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"messages",
          filter:
            `match_id=eq.${selectedMatch.matchId}`
        },
        () => {

          loadMessages();

        }
      )
      .subscribe();

}


/* =========================
   CHAT TEXT
========================= */

$("composer")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      await sendText();

    }
  );


$("messageInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        $("composer")
          .requestSubmit();

      }

    }
  );


/* =========================
   FILE SELECTION
========================= */

$("fileInput")
  .addEventListener(
    "change",
    () => {

      const files =
        [
          ...$("fileInput").files
        ];


      $("filePreview")
        .textContent =
          files.length

            ?

            `${files.length} file${
              files.length > 1
                ? "s"
                : ""
            } selected — send to upload.`

            :

            "";

    }
  );


/* =========================
   SEND TEXT + FILES
========================= */

async function sendText(){

  if(!selectedMatch){

    toast(
      "Open a match first."
    );

    return;

  }


  const text =
    $("messageInput")
      .value
      .trim();


  if(!text){

    await sendAttachments();

    return;

  }


  $("messageInput").value = "";


  const {
    error
  } =
  await db
    .from("messages")
    .insert({

      match_id:
        selectedMatch.matchId,

      sender_id:
        session.user.id,

      message:
        text

    });


  if(error){

    $("messageInput").value =
      text;

    toast(error.message);

    return;

  }


  await sendAttachments();

  await loadMessages();

}


/* =========================
   SEND ATTACHMENTS
========================= */

async function sendAttachments(){

  const files =
    [
      ...$("fileInput").files
    ];


  if(!files.length)
    return;


  for(
    const file of files
  ){

    try{

      if(
        file.size >
        15 * 1024 * 1024
      ){

        throw Error(
          `${file.name} is larger than 15MB.`
        );

      }


      const safe =
        file.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );


      const path =
        `${session.user.id}/` +
        `${selectedMatch.matchId}/` +
        `${Date.now()}-${safe}`;


      /* UPLOAD FILE */

      const {
        error:uploadError
      } =
      await db
        .storage
        .from("chat-attachments")
        .upload(
          path,
          file,
          {
            contentType:
              file.type ||
              "application/octet-stream",

            upsert:false
          }
        );


      if(uploadError)
        throw uploadError;


      /* GET PUBLIC URL */

      const {
        data:publicData
      } =
      db
        .storage
        .from("chat-attachments")
        .getPublicUrl(path);


      const publicUrl =
        publicData.publicUrl;


      /* SAVE MESSAGE */

      const {
        error:messageError
      } =
      await db
        .from("messages")
        .insert({

          match_id:
            selectedMatch.matchId,

          sender_id:
            session.user.id,

          message:"",

          attachment_url:
            publicUrl,

          attachment_name:
            safe,

          attachment_type:
            file.type ||
            "application/octet-stream"

        });


      if(messageError)
        throw messageError;


    }catch(error){

      toast(
        "Attachment failed: " +
        error.message
      );

    }

  }


  $("fileInput").value = "";

  $("filePreview").textContent = "";

  await loadMessages();

}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  try{

    let avatar =
      profile?.avatar_url ||
      null;


    const file =
      $("avatarInput").files[0];


    if(file){

      if(
        file.size >
        8 * 1024 * 1024
      ){

        throw Error(
          "Profile photo must be under 8MB."
        );

      }


      const ext =
        (
          file.name
            .split(".")
            .pop() ||
          "jpg"
        )
        .replace(
          /[^a-zA-Z0-9]/g,
          ""
        );


      const path =
        `${session.user.id}/` +
        `avatar-${Date.now()}.` +
        ext;


      const {
        error
      } =
      await db
        .storage
        .from("avatars")
        .upload(
          path,
          file,
          {
            contentType:
              file.type ||
              "image/jpeg",

            upsert:false
          }
        );


      if(error)
        throw error;


      avatar =
        db
          .storage
          .from("avatars")
          .getPublicUrl(path)
          .data
          .publicUrl;

    }


    const {
      data,
      error
    } =
    await db
      .from("profiles")
      .update({

        name:
          $("profileName")
            .value
            .trim() ||
          "Member",

        age:
          Math.max(
            18,
            Number(
              $("profileAge").value
            ) || 18
          ),

        city:
          $("profileCity")
            .value
            .trim() ||
          "Offa",

        bio:
          $("profileBio")
            .value
            .trim(),

        avatar_url:
          avatar

      })
      .eq(
        "id",
        session.user.id
      )
      .select()
      .single();


    if(error)
      throw error;


    profile = data;


    $("myAvatar").innerHTML =
      avatarHtml(profile);


    $("avatarInput").value = "";

    toast(
      "Profile saved"
    );


  }catch(error){

    toast(
      error.message
    );

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  if(realtime)
    db.removeChannel(
      realtime
    );


  await db.auth.signOut();

}


/* =========================
   START APP
========================= */

start();

</script>
